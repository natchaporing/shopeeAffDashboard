<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopee Affiliate Finder</title>
<script>
  // Theme bootstrap: runs before paint so there is no light/dark flash.
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      container: { center: true },
      extend: {
        fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"] },
        colors: {
          border: "hsl(var(--border))",
          input: "hsl(var(--input))",
          ring: "hsl(var(--ring))",
          background: "hsl(var(--background))",
          foreground: "hsl(var(--foreground))",
          primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
          secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
          destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))" },
          muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
          accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
          popover: { DEFAULT: "hsl(var(--popover))", foreground: "hsl(var(--popover-foreground))" },
          card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
          success: "hsl(var(--success))",
        },
        borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
      },
    },
  };
</script>
<style>
  :root {
    color-scheme: light;
    --background: 0 0% 100%;
    --foreground: 240 10% 3.9%;
    --card: 0 0% 100%;
    --card-foreground: 240 10% 3.9%;
    --popover: 0 0% 100%;
    --popover-foreground: 240 10% 3.9%;
    --primary: 10 78% 48%;             /* Shopee orange, darkened for AA on white text */
    --primary-foreground: 0 0% 100%;
    --secondary: 240 4.8% 95.9%;
    --secondary-foreground: 240 5.9% 10%;
    --muted: 240 4.8% 95.9%;
    --muted-foreground: 240 3.8% 46.1%;
    --accent: 240 4.8% 95.9%;
    --accent-foreground: 240 5.9% 10%;
    --destructive: 0 72% 51%;
    --destructive-foreground: 0 0% 98%;
    --success: 160 84% 30%;
    --border: 240 5.9% 90%;
    --input: 240 5.9% 90%;
    --ring: 10 78% 48%;
    --radius: 0.5rem;
  }
  .dark {
    color-scheme: dark;
    --background: 240 10% 3.9%;
    --foreground: 0 0% 98%;
    --card: 240 8% 6%;
    --card-foreground: 0 0% 98%;
    --popover: 240 8% 6%;
    --popover-foreground: 0 0% 98%;
    --primary: 10 82% 55%;
    --primary-foreground: 0 0% 100%;
    --secondary: 240 3.7% 15.9%;
    --secondary-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%;
    --muted-foreground: 240 5% 64.9%;
    --accent: 240 3.7% 15.9%;
    --accent-foreground: 0 0% 98%;
    --destructive: 0 63% 45%;
    --destructive-foreground: 0 0% 98%;
    --success: 158 64% 52%;
    --border: 240 3.7% 15.9%;
    --input: 240 3.7% 15.9%;
    --ring: 10 82% 55%;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); }
  [hidden] { display: none !important; }   /* the hidden attribute must beat display utilities (grid, inline-flex) */
  /* Signal identity colours: subtle tint + coloured text (light), translucent tint (dark). */
  .sig-Rocket { --sig: 0 72% 51%;   --sig-text: 0 74% 42%;   --sig-text-dark: 0 91% 71%; }
  .sig-Hidden { --sig: 262 83% 58%; --sig-text: 263 70% 50%; --sig-text-dark: 258 90% 76%; }
  .sig-Rising { --sig: 160 84% 39%; --sig-text: 161 94% 30%; --sig-text-dark: 158 64% 52%; }
  .sig-Fading { --sig: 215 20% 65%; --sig-text: 215 19% 45%; --sig-text-dark: 215 20% 70%; }
  .sig-Proven { --sig: 38 92% 50%;  --sig-text: 26 90% 37%;  --sig-text-dark: 43 96% 60%; }
  .sig-Steady { --sig: 240 5% 65%;  --sig-text: 240 5% 40%;  --sig-text-dark: 240 5% 75%; }
  .sig-Single { --sig: 240 6% 80%;  --sig-text: 240 4% 50%;  --sig-text-dark: 240 5% 60%; }
  .sig-Rocket, .sig-Hidden, .sig-Rising, .sig-Fading, .sig-Proven, .sig-Steady, .sig-Single { --sig-fg: var(--sig-text); }
  .dark .sig-Rocket, .dark .sig-Hidden, .dark .sig-Rising, .dark .sig-Fading, .dark .sig-Proven, .dark .sig-Steady, .dark .sig-Single { --sig-fg: var(--sig-text-dark); }
  .badge.sig-Rocket, .badge.sig-Hidden, .badge.sig-Rising, .badge.sig-Fading, .badge.sig-Proven, .badge.sig-Steady, .badge.sig-Single {
    color: hsl(var(--sig-fg)); background: hsl(var(--sig) / 0.12); border-color: hsl(var(--sig) / 0.35);
  }
  .dark .badge.sig-Rocket, .dark .badge.sig-Hidden, .dark .badge.sig-Rising, .dark .badge.sig-Fading, .dark .badge.sig-Proven, .dark .badge.sig-Steady, .dark .badge.sig-Single {
    background: hsl(var(--sig) / 0.16); border-color: hsl(var(--sig) / 0.4);
  }
  .sig-dot { background: hsl(var(--sig)); }
  .chip[aria-pressed="true"] { border-color: hsl(var(--sig) / 0.6); background: hsl(var(--sig) / 0.12); color: hsl(var(--sig-fg)); }
  .spark-tip { pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
  #modal[data-open="1"], #confirm[data-open="1"] { display: flex; }
</style>
<style type="text/tailwindcss">
  @layer base {
    * { @apply border-border; }
    body { @apply bg-background text-foreground font-sans text-sm antialiased; }
    button, input, select { @apply font-sans; }
    a { @apply underline-offset-4; }
    ::selection { @apply bg-primary/20; }
  }
  @layer components {
    .btn { @apply inline-flex h-9 shrink-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-md border border-transparent px-3 text-sm font-medium transition-colors ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50; }
    .btn svg { @apply h-4 w-4 shrink-0; }
    .btn-primary { @apply bg-primary text-primary-foreground shadow-sm hover:bg-primary/90; }
    .btn-outline { @apply border-input bg-background shadow-sm hover:bg-accent hover:text-accent-foreground; }
    .btn-ghost { @apply hover:bg-accent hover:text-accent-foreground; }
    .btn-destructive { @apply bg-destructive text-destructive-foreground shadow-sm hover:bg-destructive/90; }
    .btn-sm { @apply h-8 px-2.5 text-xs; }
    .btn-icon { @apply h-9 w-9 px-0; }
    .btn-icon.btn-sm { @apply h-8 w-8; }
    .btn[aria-pressed="true"] { @apply bg-accent text-accent-foreground; }
    .input { @apply flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-sm shadow-sm transition-colors placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 tabular-nums; }
    .select-wrap { @apply relative; }
    .select-wrap select { @apply appearance-none pr-8; }
    .select-wrap svg { @apply pointer-events-none absolute right-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground; }
    .field { @apply flex min-w-0 flex-col gap-1.5; }
    .field > span { @apply text-xs font-medium text-muted-foreground; }
    .card { @apply rounded-lg border bg-card text-card-foreground shadow-sm; }
    .card-head { @apply flex flex-wrap items-start justify-between gap-3 p-5 pb-3; }
    .card-title { @apply text-base font-semibold leading-none tracking-tight; }
    .card-desc { @apply mt-1.5 text-xs text-muted-foreground; }
    .thumb { @apply shrink-0 rounded-md border bg-muted object-cover; }
    .badge { @apply inline-flex shrink-0 items-center gap-1 rounded-md border px-2 py-0.5 text-[11px] font-semibold leading-4 whitespace-nowrap; }
    .badge-neutral { @apply border-border bg-muted text-muted-foreground; }
    .badge-ok { @apply border-emerald-500/30 bg-emerald-500/10 text-emerald-700 dark:text-emerald-400; }
    .badge-err { @apply border-red-500/30 bg-red-500/10 text-red-700 dark:text-red-400; }
    .badge-count { @apply ml-1 inline-flex h-5 min-w-[1.25rem] items-center justify-center rounded-full bg-primary px-1.5 text-[11px] font-semibold text-primary-foreground; }
    .chip { @apply inline-flex h-8 items-center gap-1.5 rounded-full border border-input bg-background px-3 text-xs font-medium transition-colors hover:bg-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ring-offset-background; }
    .chip .n { @apply rounded-full bg-muted px-1.5 py-px text-[11px] font-semibold tabular-nums text-muted-foreground; }
    .chip[aria-pressed="true"] .n { @apply bg-background/70 text-inherit; }
    .sig-dot { @apply inline-block h-2 w-2 shrink-0 rounded-full; }
    .tabs { @apply grid w-full grid-cols-4 items-center rounded-lg bg-muted p-1 text-muted-foreground; }
    .tab { @apply inline-flex h-8 items-center justify-center whitespace-nowrap rounded-md px-2 text-xs font-medium transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ring-offset-background; }
    .tab[aria-selected="true"] { @apply bg-background text-foreground shadow-sm; }
    .menu { @apply absolute right-0 z-20 mt-1 min-w-[10rem] rounded-md border bg-popover p-1 text-popover-foreground shadow-md; }
    .menu-item { @apply flex w-full cursor-pointer items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm hover:bg-accent focus-visible:outline-none focus-visible:bg-accent; }
    .tbl { @apply w-full caption-bottom text-sm; }
    .tbl.wide { @apply min-w-[1240px]; }
    /* child combinators: the expanded-row detail nests a second table that must not inherit these */
    .tbl > thead > tr > th { @apply h-11 whitespace-nowrap px-3 text-right align-middle text-xs font-medium text-muted-foreground; }
    .tbl > thead > tr > th.l, .tbl > tbody > tr > td.l { @apply text-left; }
    .tbl > tbody > tr > td { @apply h-12 whitespace-nowrap border-t px-3 py-2 align-middle text-right tabular-nums; }
    .tbl > thead > tr > th:first-child, .tbl > tbody > tr > td:first-child { @apply pl-5; }
    .tbl > thead > tr > th:last-child, .tbl > tbody > tr > td:last-child { @apply pr-5; }
    .tbl > tbody > tr[data-id] { @apply cursor-pointer transition-colors hover:bg-muted/50 focus-visible:outline-none focus-visible:bg-muted/60; }
    .tbl > tbody > tr.expanded { @apply bg-muted/40; }
    .tbl > tbody > tr.detail > td { @apply whitespace-normal bg-muted/30 p-0 text-left; }
    .detail-inner { @apply sticky left-0 p-5; }
    .th-btn { @apply -ml-1.5 inline-flex h-8 items-center gap-0.5 rounded-md px-1.5 text-xs font-medium text-muted-foreground hover:bg-accent hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring; }
    .th-btn svg { @apply h-3.5 w-3.5 opacity-0 transition-opacity; }
    .th-btn:hover svg { @apply opacity-60; }
    th[aria-sort] .th-btn { @apply text-foreground; }
    th[aria-sort] .th-btn svg { @apply opacity-100 text-primary; }
    .meter { @apply inline-flex items-center justify-end gap-2; }
    .meter .track { @apply relative h-1.5 w-12 overflow-hidden rounded-full bg-primary/15; }
    .meter .fill { @apply absolute inset-y-0 left-0 rounded-full bg-primary; }
    .meter .num { @apply w-6 text-right; }
    .pos { @apply text-emerald-700 dark:text-emerald-400; }
    .neg { @apply text-red-700 dark:text-red-400; }
    .muted { @apply text-muted-foreground; }
    .mini { @apply w-full text-xs; }
    .mini th { @apply h-9 whitespace-nowrap px-2 text-right font-medium text-muted-foreground first:pl-3 last:pr-3; }
    .mini th.l, .mini td.l { @apply text-left; }
    .mini td { @apply whitespace-nowrap border-t px-2 py-2 text-right tabular-nums first:pl-3 last:pr-3; }
    .list li { @apply flex items-center gap-3 rounded-md px-2 py-2 transition-colors hover:bg-muted/60 focus-visible:outline-none focus-visible:bg-muted/60 cursor-pointer; }
    .list .n { @apply w-4 shrink-0 text-right text-xs tabular-nums text-muted-foreground; }
    .list .t { @apply min-w-0 flex-1 truncate font-medium; }
    .list .v { @apply shrink-0 text-right text-sm font-semibold tabular-nums; }
    .pick { @apply flex cursor-pointer gap-4 rounded-lg border border-border/70 bg-card p-4 text-left transition-colors hover:border-primary/60 hover:bg-accent/40 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 ring-offset-background; }
    .pick .body { @apply flex min-w-0 flex-1 flex-col gap-1.5; }
    .pick .head { @apply flex items-center gap-2; }
    .pick .head b { @apply min-w-0 flex-1 truncate font-semibold; }
    .pick .why { @apply text-xs leading-5 text-muted-foreground; }
    .pick .kpis { @apply mt-1.5 grid grid-cols-3 gap-3; }
    .pick .kpis .val { @apply text-sm font-semibold tabular-nums; }
    .pick .kpis .lbl { @apply text-xs text-muted-foreground; }
    .dl { @apply grid grid-cols-[auto_minmax(0,1fr)] gap-x-4 gap-y-2 text-xs; }
    .dl dt { @apply text-muted-foreground; }
    .dl dd { @apply truncate text-right font-medium tabular-nums; }
    .kv { @apply grid grid-cols-2 gap-3 sm:grid-cols-5; }
    .kv .lbl { @apply text-xs text-muted-foreground; }
    .kv .val { @apply text-sm font-semibold tabular-nums; }
    .skel { @apply animate-pulse rounded bg-muted; }
    .empty { @apply flex flex-col items-center justify-center gap-2 px-6 py-14 text-center; }
    .empty svg { @apply h-8 w-8 text-muted-foreground/70; }
    .empty h4 { @apply text-sm font-semibold; }
    .empty p { @apply max-w-sm text-xs text-muted-foreground; }
    .overlay { @apply fixed inset-0 z-50 hidden items-start justify-center overflow-y-auto bg-black/60 p-4 backdrop-blur-[2px] sm:p-8 dark:bg-black/70; }
    .dialog { @apply w-full rounded-lg border bg-card text-card-foreground shadow-lg; }
    .toast { @apply flex w-80 items-start gap-2.5 rounded-md border bg-card p-3 text-sm shadow-lg; }
    .toast svg { @apply mt-0.5 h-4 w-4 shrink-0; }
  }
</style>
</head>
<body>

<!-- ============ Header ============ -->
<header class="sticky top-0 z-30 border-b bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/80">
  <div class="mx-auto flex max-w-[1600px] flex-wrap items-center gap-2 px-4 py-2.5 sm:px-6">
    <a href="/" class="mr-2 flex items-center gap-2.5 no-underline">
      <span class="flex h-8 w-8 items-center justify-center rounded-md bg-primary text-primary-foreground shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
      </span>
      <span class="text-sm font-semibold tracking-tight">Shopee Affiliate Finder</span>
    </a>

    <div class="ml-auto flex flex-wrap items-center gap-2">
      <label class="select-wrap flex items-center" aria-label="Snapshot date">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pointer-events-none absolute left-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" style="right:auto"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <select id="date" class="input h-9 w-[168px] pl-8 font-medium" title="Snapshot date"></select>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </label>
      <span class="mx-1 hidden h-6 w-px bg-border sm:block" aria-hidden="true"></span>
      <button id="pullMock" class="btn btn-outline" title="Ingest synthetic data for the selected date">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></svg>
        <span>Pull (mock)</span>
      </button>
      <button id="pullLive" class="btn btn-primary" title="Ingest live data from the Shopee Open API">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8l-4-4"/><path d="m12 21 4-4"/><path d="M4.393 15.269A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.436 8.284"/></svg>
        <span>Pull (live)</span>
      </button>
      <button id="purgeMock" class="btn btn-outline text-destructive hover:text-destructive" title="Delete all synthetic demo rows">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
        <span>Clear mock</span>
      </button>
      <span class="mx-1 hidden h-6 w-px bg-border sm:block" aria-hidden="true"></span>
      <button id="themeToggle" class="btn btn-outline btn-icon" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dark:hidden"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden dark:block"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="mx-auto flex max-w-[1600px] flex-col gap-6 px-4 py-6 sm:px-6">

  <!-- ============ Overview: title + one status line ============ -->
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div class="min-w-0">
      <h1 class="text-xl font-semibold tracking-tight">Overview</h1>
      <p id="status" class="mt-1.5 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-muted-foreground" aria-live="polite">Loading…</p>
    </div>
    <button id="homeToggle" class="btn btn-ghost btn-sm text-muted-foreground" aria-expanded="true" aria-controls="home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      <span id="homeToggleText">Hide home panels</span>
    </button>
  </div>

  <!-- ============ Home: suggestions + tabbed top lists ============ -->
  <section id="home" class="grid grid-cols-1 gap-6 xl:grid-cols-5" aria-label="Suggestions and top lists"></section>

  <!-- ============ Products ============ -->
  <section class="card" aria-labelledby="productsTitle">
    <div class="card-head">
      <div>
        <h2 id="productsTitle" class="card-title">Products</h2>
        <p class="card-desc" id="productsDesc">Click a row for its rank history.</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="colsToggle" type="button" class="btn btn-outline btn-sm" aria-pressed="false" title="Show every metric column">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
          More columns
        </button>
        <div class="relative">
          <button id="exportBtn" type="button" class="btn btn-outline btn-sm" aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            Export
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-60"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div id="exportMenu" class="menu" role="menu" aria-label="Export" hidden>
            <button id="csv" type="button" class="menu-item" role="menuitem">Download CSV</button>
            <button id="json" type="button" class="menu-item" role="menuitem">Download JSON</button>
          </div>
        </div>
      </div>
    </div>

    <form id="filtersForm" class="filters flex flex-col gap-3 px-5 pb-5" onsubmit="return false" aria-label="Filters">
      <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Signal filters">
        <span class="mr-1 text-xs font-medium text-muted-foreground">Signals</span>
        <div id="chips" class="flex flex-wrap items-center gap-1.5"></div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <span class="relative w-full max-w-xs">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pointer-events-none absolute left-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="q" class="input pl-8" placeholder="Search title or shop" aria-label="Search title or shop">
        </span>
        <button id="apply" type="submit" class="btn btn-primary">Apply</button>
        <button id="filtersToggle" type="button" class="btn btn-outline" aria-expanded="false" aria-controls="filtersPanel">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filters<span id="filtersCount" class="badge-count" hidden>0</span>
        </button>
        <button id="reset" type="button" class="btn btn-ghost text-muted-foreground" title="Clear search, signals and filters">Reset</button>

      <div id="filtersPanel" class="grid grid-cols-2 gap-4 rounded-lg bg-muted/50 p-4 md:grid-cols-3 xl:grid-cols-6" hidden>
        <label class="field">
          <span>Category</span>
          <span class="select-wrap"><select id="category" class="input"><option value="">All categories</option></select>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        </label>
        <label class="field"><span>Min price</span><input type="number" id="min_price" class="input" step="1" min="0" placeholder="0"></label>
        <label class="field"><span>Max price</span><input type="number" id="max_price" class="input" step="1" min="0" placeholder="Any"></label>
        <label class="field"><span>Min commission %</span><input type="number" id="min_commission" class="input" step="0.5" min="0" placeholder="0"></label>
        <label class="field"><span>Min monthly sales</span><input type="number" id="min_sales" class="input" step="10" min="0" placeholder="0"></label>
        <label class="field"><span>Min rating</span><input type="number" id="min_rating" class="input" step="0.1" min="0" max="5" placeholder="0"></label>
      </div>
    </form>

    <div id="tblWrap" class="w-full overflow-x-auto border-t" aria-busy="false">
      <table id="tbl" class="tbl">
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>

    <div class="flex flex-wrap items-center justify-between gap-3 border-t px-5 py-3 text-xs text-muted-foreground">
      <span id="count" aria-live="polite"></span>
      <div class="flex items-center gap-2">
        <span id="page" class="tabular-nums"></span>
        <button id="prev" class="btn btn-outline btn-sm" aria-label="Previous page">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Prev
        </button>
        <button id="next" class="btn btn-outline btn-sm" aria-label="Next page">
          Next
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>

  </section>
</main>

<!-- ============ Detail dialog ============ -->
<div id="modal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" data-open="0">
  <div class="dialog max-w-[1200px]" id="modalBox"></div>
</div>

<!-- ============ Confirm dialog ============ -->
<div id="confirm" class="overlay items-center" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDesc" data-open="0">
  <div class="dialog max-w-md p-5">
    <h3 id="confirmTitle" class="text-base font-semibold">Delete mock data?</h3>
    <p id="confirmDesc" class="mt-1.5 text-sm text-muted-foreground">Every synthetic demo row will be removed. Live Shopee data is untouched.</p>
    <div class="mt-5 flex justify-end gap-2">
      <button id="confirmCancel" class="btn btn-outline">Cancel</button>
      <button id="confirmOk" class="btn btn-destructive">Delete</button>
    </div>
  </div>
</div>

<div id="toast" class="pointer-events-none fixed bottom-4 right-4 z-[60] flex flex-col gap-2" aria-live="polite"></div>

<script>
const SIGNALS = {{ signals|tojson }};
const imgSrc = it => (it.image_url && !/\.example\//.test(it.image_url)) ? it.image_url : `/img/placeholder/${it.item_id}.svg`;
const thumb = (it, cls) => `<img class="thumb ${cls}" src="${esc(imgSrc(it))}" alt="" loading="lazy" onerror="this.onerror=null;this.src='/img/placeholder/${it.item_id}.svg'">`;
// [key, label, left-aligned, essential]
const COLS = [
  ["rank","Rank",false,true], ["title","Product",true,true], ["category","Category",true,false], ["price","Price",false,true],
  ["commission_rate","Comm %",false,true], ["monthly_sales","Sales/mo",false,true], ["est_monthly_revenue","Est. rev.",false,false],
  ["rating","Rating",false,false], ["partner_count","Creators",false,false], ["gap_score","Gap",false,false],
  ["angel_score","Angel",false,false], ["rank_velocity","Velocity",false,true], ["rank_acceleration","Accel",false,false],
  ["breakout_score","Breakout",false,true], ["signal","Signal",false,true],
];
const FILTER_IDS = ["category","min_price","max_price","min_commission","min_sales","min_rating","q"];
const NUMERIC_FILTERS = ["category","min_price","max_price","min_commission","min_sales","min_rating"];
const store = {
  get: (k, d=null) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};
const state = { sort:"breakout_score", order:"desc", limit:100, offset:0, signals:new Set(), meta:null,
                allCols: store.get("moreCols") === "1", home:null, tab: store.get("homeTab", "top_sales"), picksAll:false, suggested:new Map() };
const $ = id => document.getElementById(id);
const activeCols = () => COLS.filter(c => state.allCols || c[3]);

// ---------- icons (lucide) ----------
const ICON = {
  arrowUp: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  arrowDown: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  sortNone: '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  ext: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
  db: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>',
  filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
  ok: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  chevronRight: '<path d="m9 18 6-6-6-6"/>',
  chevronDown: '<path d="m6 9 6 6 6-6"/>',
  chevronUp: '<path d="m18 15-6-6-6 6"/>',
  trend: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  calendar: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
};
const ic = (name, cls="h-4 w-4") => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${ICON[name]}</svg>`;

// ---------- formatting ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DASH = '<span class="muted">–</span>';
const fmt = (v, d=0) => v==null ? DASH : Number(v).toLocaleString("en-US",{minimumFractionDigits:d, maximumFractionDigits:d});
const compact = v => v==null ? DASH : Math.abs(v) >= 1e6 ? (v/1e6).toFixed(1).replace(/\.0$/,"")+"M" : Math.abs(v) >= 1e4 ? (v/1e3).toFixed(1).replace(/\.0$/,"")+"K" : fmt(v);
const pct = v => v==null ? "–" : (v*100).toFixed(1)+"%";
const rating = v => v==null ? DASH : Number(v).toFixed(1);
const signed = v => v==null ? DASH : `<span class="${v>0?'pos':v<0?'neg':'muted'}">${v>0?'+':v<0?'−':''}${Math.abs(Number(v)).toFixed(0)}</span>`;
const badge = (sig, extra="") => sig ? `<span class="badge sig-${esc(sig)} ${extra}">${esc(sig)}</span>` : "";
const meter = v => `<span class="meter"><span class="track" aria-hidden="true"><span class="fill" style="width:${Math.max(0,Math.min(100,v||0))}%"></span></span><span class="num">${fmt(v)}</span></span>`;

function params(extra={}) {
  const p = new URLSearchParams();
  const d = $("date").value; if (d) p.set("date", d);
  for (const k of FILTER_IDS) { const v = $(k).value; if (v !== "") p.set(k, v); }
  if (state.signals.size) p.set("signal", [...state.signals].join(","));
  p.set("sort", state.sort); p.set("order", state.order);
  for (const [k,v] of Object.entries(extra)) p.set(k, v);
  return p;
}

// ---------- toasts ----------
function toast(msg, kind="ok") {
  const el = document.createElement("div");
  el.className = "toast pointer-events-auto " + (kind==="ok" ? "" : "border-destructive/40");
  el.setAttribute("role", kind==="ok" ? "status" : "alert");
  el.innerHTML = `${ic(kind==="ok"?"ok":"alert", "h-4 w-4 " + (kind==="ok"?"text-emerald-600 dark:text-emerald-400":"text-destructive"))}<div class="min-w-0 flex-1">${esc(msg)}</div>
    <button class="btn btn-ghost btn-icon btn-sm -mr-1 -mt-1 h-7 w-7" aria-label="Dismiss">${ic("x","h-3.5 w-3.5")}</button>`;
  el.querySelector("button").onclick = () => el.remove();
  $("toast").appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

// ---------- meta: date, category, chips, status ----------
async function loadMeta(keepDate=false) {
  const d = keepDate ? $("date").value : "";
  const m = await (await fetch("/api/meta" + (d ? "?date="+d : ""))).json();
  state.meta = m;
  $("date").innerHTML = m.dates.length
    ? m.dates.map(x => `<option value="${x}" ${x===m.date?"selected":""}>${x}</option>`).join("")
    : `<option value="">No snapshots</option>`;
  const cat = $("category").value;
  $("category").innerHTML = `<option value="">All categories</option>` +
    m.categories.map(c => `<option value="${esc(c.category)}">${esc(c.category)} (${c.count})</option>`).join("");
  $("category").value = cat;
  renderChips();
  const run = m.runs && m.runs[0];
  if (m.latest) {
    const ok = run && run.status === "ok";
    $("status").innerHTML =
      `<span class="inline-flex items-center gap-1">${ic("calendar","h-3.5 w-3.5")}Snapshot <b class="font-medium text-foreground">${esc(m.date)}</b></span>
       <span aria-hidden="true">·</span><span><b class="font-medium text-foreground tabular-nums">${fmt(m.total)}</b> items</span>
       <span aria-hidden="true">·</span><span>${m.dates.length} day${m.dates.length===1?"":"s"} of history</span>
       ${run ? `<span aria-hidden="true">·</span><span class="inline-flex items-center gap-1.5">Last run <span class="badge ${ok?"badge-ok":"badge-err"}">${esc(run.status||"?")}</span>${run.source==="mock"?`<span class="badge badge-neutral">mock</span>`:""}</span>` : ""}`;
    $("productsDesc").textContent = `${fmt(m.total)} items on ${m.date}. Click a row for its rank history.`;
  } else {
    $("status").innerHTML = `<span class="inline-flex items-center gap-1.5">${ic("alert","h-3.5 w-3.5")}No data yet — use <b class="font-medium text-foreground">Pull (mock)</b> to try it with synthetic data.</span>`;
    $("productsDesc").textContent = "Nothing ingested yet.";
  }
}

function renderChips() {
  const m = state.meta || {signals:{}};
  $("chips").innerHTML = SIGNALS.map(s =>
    `<button type="button" class="chip sig-${s}" data-s="${s}" aria-pressed="${state.signals.has(s)}"><span class="sig-dot" aria-hidden="true"></span>${s}<span class="n">${fmt(m.signals[s]||0)}</span></button>`).join("");
  document.querySelectorAll("#chips .chip").forEach(c => c.onclick = () => toggleSignal(c.dataset.s));
}
function toggleSignal(s) {
  state.signals.has(s) ? state.signals.delete(s) : state.signals.add(s);
  state.offset = 0; renderChips(); load();
}

// ---------- filters disclosure ----------
function updateFilterCount() {
  const n = NUMERIC_FILTERS.filter(k => $(k).value !== "").length;
  $("filtersCount").textContent = n; $("filtersCount").hidden = n === 0;
  $("filtersToggle").classList.toggle("border-primary/60", n > 0);
}
function setFiltersOpen(open) {
  $("filtersPanel").hidden = !open;
  $("filtersToggle").setAttribute("aria-expanded", String(open));
}
$("filtersToggle").onclick = () => setFiltersOpen($("filtersPanel").hidden);
NUMERIC_FILTERS.forEach(k => $(k).addEventListener("input", updateFilterCount));

// ---------- export menu ----------
function setExportOpen(open) { $("exportMenu").hidden = !open; $("exportBtn").setAttribute("aria-expanded", String(open)); }
$("exportBtn").onclick = () => setExportOpen($("exportMenu").hidden);
document.addEventListener("click", e => { if (!e.target.closest("#exportBtn, #exportMenu")) setExportOpen(false); });

// ---------- table ----------
function setCols(all, persist=true) {
  state.allCols = all;
  $("colsToggle").setAttribute("aria-pressed", String(all));
  $("colsToggle").title = all ? "Show only the essential columns" : "Show every metric column";
  $("tbl").classList.toggle("wide", all);
  if (persist) store.set("moreCols", all ? "1" : "0");
}
$("colsToggle").onclick = () => { setCols(!state.allCols); load(); };
setCols(state.allCols, false);

function renderHead() {
  $("head").innerHTML = activeCols().map(([k,label,left]) => {
    const active = state.sort === k;
    const icon = active ? (state.order === "desc" ? "arrowDown" : "arrowUp") : "sortNone";
    return `<th scope="col" class="${left?'l':''}" ${active?`aria-sort="${state.order==="desc"?"descending":"ascending"}"`:""}>
      <button type="button" class="th-btn ${left?'':'flex-row-reverse -mr-1.5 ml-0'}" data-k="${k}" title="Sort by ${label}">${label}${ic(icon)}</button></th>`;
  }).join("");
  document.querySelectorAll("#head .th-btn").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (state.sort === k) state.order = state.order === "desc" ? "asc" : "desc";
    else { state.sort = k; state.order = ["title","category","rank","signal"].includes(k) ? "asc" : "desc"; }
    state.offset = 0; load();
  });
}

const CELL = {
  rank: it => `<td class="text-muted-foreground">${fmt(it.rank)}</td>`,
  title: it => `<td class="l max-w-[360px]">
        <div class="flex items-center gap-3">${thumb(it, "h-9 w-9")}<div class="min-w-0">
        <div class="truncate font-medium" title="${esc(it.title)}">${it.product_link?`<a class="hover:underline" href="${esc(it.product_link)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title)}</div>
        <div class="truncate text-xs text-muted-foreground">${esc(it.shop_name||"")}</div>
        </div></div></td>`,
  category: it => `<td class="l text-muted-foreground">${esc(it.category||"")}</td>`,
  price: it => `<td>${fmt(it.price,2)}</td>`,
  commission_rate: it => `<td>${pct(it.commission_rate)}</td>`,
  monthly_sales: it => `<td>${fmt(it.monthly_sales)}</td>`,
  est_monthly_revenue: it => `<td>${fmt(it.est_monthly_revenue)}</td>`,
  rating: it => `<td>${rating(it.rating)}</td>`,
  partner_count: it => `<td>${fmt(it.partner_count)}</td>`,
  gap_score: it => `<td>${fmt(it.gap_score)}</td>`,
  angel_score: it => `<td>${meter(it.angel_score)}</td>`,
  rank_velocity: it => `<td>${signed(it.rank_velocity)}</td>`,
  rank_acceleration: it => `<td>${signed(it.rank_acceleration)}</td>`,
  breakout_score: it => `<td>${meter(it.breakout_score)}</td>`,
  signal: it => `<td>${badge(it.signal)}</td>`,
};

const skeletonRows = (n=8) => Array.from({length:n}, () => `<tr aria-hidden="true">${activeCols().map(([k,,left]) =>
  `<td class="${left?'l':''}"><span class="skel inline-block h-3 ${k==="title"?"w-56":"w-10"}"></span></td>`).join("")}</tr>`).join("");

function emptyState(kind, msg) {
  const noData = kind === "nodata";
  return `<tr><td colspan="${activeCols().length}" class="l whitespace-normal"><div class="empty">
    ${ic(noData ? "db" : "filter", "h-8 w-8")}
    <h4>${noData ? "No snapshots yet" : "No products match these filters"}</h4>
    <p>${noData ? "Pull (mock) ingests a synthetic day of data so you can try the dashboard; Pull (live) needs Shopee credentials in .env." : esc(msg || "Try widening the price range, lowering the minimums, or clearing the signal filter.")}</p>
    ${noData ? `<button type="button" class="btn btn-outline btn-sm mt-2" onclick="pull(true)">Pull (mock)</button>` : `<button type="button" class="btn btn-outline btn-sm mt-2" onclick="$('reset').click()">Reset filters</button>`}
  </div></td></tr>`;
}

async function load() {
  renderHead(); updateFilterCount();
  $("tblWrap").setAttribute("aria-busy", "true");
  if (!$("body").querySelector("tr[data-id]")) $("body").innerHTML = skeletonRows();
  let r;
  try { r = await fetch("/api/products?" + params({limit:state.limit, offset:state.offset})); }
  finally { $("tblWrap").setAttribute("aria-busy", "false"); }
  if (!r.ok) {
    const detail = (await r.json()).detail;
    $("body").innerHTML = emptyState(r.status === 404 ? "nodata" : "error", detail);
    $("count").textContent = ""; $("page").textContent = "";
    $("prev").disabled = $("next").disabled = true;
    return;
  }
  const data = await r.json();
  const cols = activeCols();
  $("body").innerHTML = data.items.map(it => `<tr data-id="${it.item_id}" tabindex="0" aria-expanded="false">${cols.map(([k]) => CELL[k](it)).join("")}</tr>`).join("") || emptyState("nomatch");
  document.querySelectorAll("tr[data-id]").forEach(tr => {
    tr.onclick = e => { if (!e.target.closest("a")) toggleDetail(tr); };
    tr.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === tr) { e.preventDefault(); toggleDetail(tr); } };
  });
  const from = data.total ? data.offset+1 : 0, to = Math.min(data.offset+data.limit, data.total);
  $("count").innerHTML = `Showing <b class="font-medium text-foreground tabular-nums">${fmt(from)}–${fmt(to)}</b> of <b class="font-medium text-foreground tabular-nums">${fmt(data.total)}</b>`;
  $("page").textContent = `Page ${Math.floor(data.offset/data.limit)+1} of ${Math.max(1,Math.ceil(data.total/data.limit))}`;
  $("prev").disabled = data.offset === 0; $("next").disabled = to >= data.total;
}

// ---------- detail: sparkline + history ----------
function sparkline(hist) {
  const pts = hist.filter(h => h.rank != null);
  if (pts.length < 2) return `<div class="empty py-8">${ic("trend")}<p>Not enough history for a chart yet — needs two or more days.</p></div>`;
  const W=300,H=96,PX=10,PT=10,PB=18, ranks = pts.map(h=>h.rank), lo=Math.min(...ranks), hi=Math.max(...ranks);
  const x = i => PX + i*(W-2*PX)/(pts.length-1), y = r => hi===lo ? (PT+(H-PB))/2 : PT + (r-lo)*(H-PT-PB)/(hi-lo);
  const line = pts.map((h,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(h.rank).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length-1).toFixed(1)},${H-PB} L${x(0).toFixed(1)},${H-PB} Z`;
  const last = pts.length-1;
  const data = esc(JSON.stringify(pts.map(h => ({d:h.snapshot_date, r:h.rank}))));
  return `<div class="spark relative" data-pts="${data}" data-w="${W}" data-px="${PX}">
    <svg viewBox="0 0 ${W} ${H}" class="block h-auto w-full" role="img" aria-label="Rank over ${pts.length} days, best #${lo}, worst #${hi}">
      <line x1="${PX}" x2="${W-PX}" y1="${PT}" y2="${PT}" stroke="hsl(var(--border))" stroke-dasharray="2 3"/>
      <line x1="${PX}" x2="${W-PX}" y1="${H-PB}" y2="${H-PB}" stroke="hsl(var(--border))"/>
      <path d="${area}" fill="hsl(var(--primary))" fill-opacity="0.08"/>
      <path d="${line}" fill="none" stroke="hsl(var(--primary))" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="cross" x1="0" x2="0" y1="${PT}" y2="${H-PB}" stroke="hsl(var(--muted-foreground))" stroke-dasharray="3 3" style="display:none"/>
      ${pts.map((h,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(h.rank).toFixed(1)}" r="${i===last?4:2.5}" fill="${i===last?"hsl(var(--primary))":"hsl(var(--card))"}" stroke="hsl(var(--primary))" stroke-width="${i===last?2:1.5}"><title>${h.snapshot_date}: rank #${h.rank}</title></circle>`).join("")}
      <text x="${PX}" y="${H-4}" font-size="10" fill="hsl(var(--muted-foreground))">${pts[0].snapshot_date.slice(5)}</text>
      <text x="${W-PX}" y="${H-4}" font-size="10" text-anchor="end" fill="hsl(var(--muted-foreground))">${pts[last].snapshot_date.slice(5)}</text>
    </svg>
    <div class="spark-tip absolute top-0 hidden rounded-md border bg-popover px-2 py-1 text-xs shadow-md tabular-nums"></div>
    <div class="mt-1.5 flex items-center justify-between gap-2 whitespace-nowrap text-xs text-muted-foreground"><span>Rank · up is better</span><span>best <b class="font-medium text-foreground">#${lo}</b> · worst <b class="font-medium text-foreground">#${hi}</b></span></div>
  </div>`;
}
function bindSparks(root) {
  root.querySelectorAll(".spark").forEach(sp => {
    const pts = JSON.parse(sp.dataset.pts), W = +sp.dataset.w, PX = +sp.dataset.px;
    const svg = sp.querySelector("svg"), cross = sp.querySelector(".cross"), tip = sp.querySelector(".spark-tip");
    const hide = () => { cross.style.display = "none"; tip.classList.add("hidden"); };
    svg.addEventListener("mousemove", e => {
      const rect = svg.getBoundingClientRect();
      const xu = (e.clientX - rect.left) / rect.width * W;
      const i = Math.max(0, Math.min(pts.length-1, Math.round((xu-PX)/((W-2*PX)/(pts.length-1)))));
      const xs = PX + i*(W-2*PX)/(pts.length-1);
      cross.setAttribute("x1", xs); cross.setAttribute("x2", xs); cross.style.display = "";
      const prev = pts[i-1], delta = prev ? prev.r - pts[i].r : null;
      tip.innerHTML = `<span class="text-muted-foreground">${pts[i].d}</span> · rank <b class="font-semibold">#${pts[i].r}</b>${delta==null?"":` <span class="${delta>0?"pos":delta<0?"neg":"muted"}">${delta>0?"+":""}${delta}</span>`}`;
      tip.classList.remove("hidden");
      const frac = xs / W;
      tip.style.left = frac > 0.6 ? "auto" : `${frac*100}%`;
      tip.style.right = frac > 0.6 ? `${(1-frac)*100}%` : "auto";
    });
    svg.addEventListener("mouseleave", hide);
  });
}

// "Why it's suggested": reasons/score come from the /api/home payload, kept in a lookup map (the item endpoint has none).
function whySuggested(it) {
  const s = state.suggested.get(String(it.item_id));
  if (!s) return "";
  return `<div class="rounded-lg border border-primary/30 bg-primary/5 p-4">
    <div class="flex items-center gap-2 text-sm font-semibold">${ic("sparkles","h-4 w-4 text-primary")}Why it's suggested
      <span class="ml-auto text-xs font-medium text-muted-foreground">Score <b class="text-sm font-semibold text-primary tabular-nums">${fmt(s.suggest_score)}</b></span></div>
    <ul class="mt-2.5 flex flex-col gap-1.5 text-sm">${(s.reasons||[]).map(x=>`<li class="flex items-start gap-2">${ic("check","mt-0.5 h-4 w-4 shrink-0 text-emerald-600 dark:text-emerald-400")}<span>${esc(x)}</span></li>`).join("")}</ul>
    <div class="kv mt-4">
      <div><div class="lbl">Rank</div><div class="val">#${fmt(s.rank)}</div></div>
      <div><div class="lbl">Price</div><div class="val">${fmt(s.price,2)}</div></div>
      <div><div class="lbl">Sales/mo</div><div class="val">${fmt(s.monthly_sales)}</div></div>
      <div><div class="lbl">Commission</div><div class="val">${pct(s.commission_rate)}</div></div>
      <div><div class="lbl">Creators</div><div class="val">${fmt(s.partner_count)}</div></div>
    </div>
  </div>`;
}

function detailHtml(d) {
  const it = d.item;
  const link = (href, label) => href ? `<a class="btn btn-outline btn-sm" href="${esc(href)}" target="_blank" rel="noopener">${label}${ic("ext","h-3.5 w-3.5")}</a>` : "";
  return `<div class="grid gap-5 md:grid-cols-[280px_minmax(0,1fr)]">
    <div class="flex min-w-0 flex-col gap-4">
      <div class="overflow-hidden rounded-lg border bg-muted"><img class="aspect-square w-full object-cover" src="${esc(imgSrc(it))}" alt="${esc(it.title)}" onerror="this.onerror=null;this.src='/img/placeholder/${it.item_id}.svg'"></div>
      <div class="rounded-lg border bg-card p-4">${sparkline(d.history)}</div>
      <dl class="dl rounded-lg border bg-card p-4">
        <dt>Item ID</dt><dd>${esc(it.item_id)}</dd>
        <dt>Shop</dt><dd title="${esc(it.shop_name||it.shop_id||"")}">${esc(it.shop_name||it.shop_id||"–")}</dd>
        <dt>Category</dt><dd>${esc(it.category||"–")}</dd>
        <dt>Cumulative sales</dt><dd>${fmt(it.cumulative_sales)}</dd>
        <dt>Creators</dt><dd>${fmt(it.partner_count)}</dd>
        <dt>Headroom</dt><dd>${fmt(it.headroom)}</dd>
        <dt>Gap percentile</dt><dd>${fmt(it.gap_percentile)}</dd>
        <dt>History</dt><dd>${fmt(it.history_days)} day${it.history_days===1?"":"s"}</dd>
      </dl>
      ${(it.product_link||it.offer_link) ? `<div class="flex flex-wrap gap-2">${link(it.product_link,"Product page")}${link(it.offer_link,"Affiliate link")}</div>` : ""}
    </div>
    <div class="flex min-w-0 flex-col gap-4">
      ${whySuggested(it)}
      <div class="min-w-0 overflow-x-auto rounded-lg border bg-card">
        <table class="mini min-w-[640px]"><thead><tr><th class="l">Date</th><th>Rank</th><th>Price</th><th>Comm %</th><th>Sales/mo</th><th>Rating</th><th>Velocity</th><th>Accel</th><th>Angel</th><th>Breakout</th><th>Signal</th></tr></thead>
        <tbody>${d.history.slice().reverse().map(h=>`<tr><td class="l text-muted-foreground">${esc(h.snapshot_date)}</td><td class="font-medium">${fmt(h.rank)}</td><td>${fmt(h.price,2)}</td><td>${pct(h.commission_rate)}</td><td>${fmt(h.monthly_sales)}</td><td>${rating(h.rating)}</td><td>${signed(h.rank_velocity)}</td><td>${signed(h.rank_acceleration)}</td><td>${fmt(h.angel_score)}</td><td>${fmt(h.breakout_score)}</td><td>${badge(h.signal)}</td></tr>`).join("")}</tbody></table>
      </div>
    </div>
  </div>`;
}

async function toggleDetail(tr) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("detail")) { next.remove(); tr.classList.remove("expanded"); tr.setAttribute("aria-expanded","false"); return; }
  const d = await (await fetch("/api/products/"+tr.dataset.id)).json();
  const row = document.createElement("tr"); row.className = "detail";
  row.innerHTML = `<td colspan="${activeCols().length}"><div class="detail-inner">${detailHtml(d)}</div></td>`;
  tr.after(row); tr.classList.add("expanded"); tr.setAttribute("aria-expanded","true");
  sizeDetails(); bindSparks(row);
}
// The table may be wider than its scrolling card; pin each detail panel to the visible width so nothing is cut off.
function sizeDetails() {
  const w = $("tblWrap").clientWidth;
  document.querySelectorAll(".detail-inner").forEach(el => { el.style.width = w + "px"; });
}
window.addEventListener("resize", sizeDetails);

// ---------- dialogs ----------
let lastFocus = null;
function closeModal() {
  if ($("modal").dataset.open !== "1") return;
  $("modal").dataset.open = "0";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
async function openModal(itemId) {
  const d = await (await fetch("/api/products/"+itemId)).json();
  lastFocus = document.activeElement;
  $("modalBox").innerHTML = `
    <div class="flex items-start gap-3 border-b p-5">
      <div class="min-w-0 flex-1">
        <h3 id="modalTitle" class="flex flex-wrap items-center gap-2 text-base font-semibold leading-6"><span class="min-w-0 truncate">${esc(d.item.title)}</span>${badge(d.item.signal)}</h3>
        <p class="mt-1 text-xs text-muted-foreground">Rank <b class="font-medium text-foreground tabular-nums">#${fmt(d.item.rank)}</b> · ${fmt(d.item.monthly_sales)} sales/mo · ${pct(d.item.commission_rate)} commission · price ${fmt(d.item.price,2)} · ${esc(d.item.shop_name||"")}</p>
      </div>
      <button id="modalClose" class="btn btn-ghost btn-icon btn-sm -mr-1 -mt-1" aria-label="Close">${ic("x")}</button>
    </div>
    <div class="p-5">${detailHtml(d)}</div>`;
  $("modal").dataset.open = "1";
  $("modalClose").onclick = closeModal;
  $("modalClose").focus();
  bindSparks($("modalBox"));
}
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

let confirmResolve = null;
function confirmDialog() {
  return new Promise(res => {
    confirmResolve = res; lastFocus = document.activeElement;
    $("confirm").dataset.open = "1"; $("confirmCancel").focus();
  });
}
function settleConfirm(v) {
  if ($("confirm").dataset.open !== "1") return;
  $("confirm").dataset.open = "0";
  if (lastFocus && lastFocus.focus) lastFocus.focus();
  if (confirmResolve) { confirmResolve(v); confirmResolve = null; }
}
$("confirmCancel").onclick = () => settleConfirm(false);
$("confirmOk").onclick = () => settleConfirm(true);
$("confirm").onclick = e => { if (e.target.id === "confirm") settleConfirm(false); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); settleConfirm(false); setExportOpen(false); } });

// ---------- home: suggestions + tabbed top lists ----------
const PICKS_DEFAULT = 6, LIST_ROWS = 8;
// [key in /api/home, tab label, description, sort key for "View all", value renderer]
const TABS = [
  ["top_sales", "Sales", "Most sales — units sold per month", "monthly_sales", it => fmt(it.monthly_sales)],
  ["top_commission", "Commission", "Highest commission rate, among items with sales", "commission_rate", it => pct(it.commission_rate)],
  ["top_revenue", "Revenue", "Biggest revenue pool — price × commission × sales per month", "est_monthly_revenue", it => compact(it.est_monthly_revenue)],
  ["movers", "Climbers", "Fastest climbers — rank places gained over the last window", "rank_velocity", it => signed(it.rank_velocity)],
];

function renderPicks() {
  const h = state.home, all = h.suggestions, shown = state.picksAll ? all : all.slice(0, PICKS_DEFAULT);
  const cards = shown.map(it => `<div class="pick" data-id="${it.item_id}" tabindex="0" role="button">
      ${thumb(it, "h-16 w-16")}
      <div class="body">
        <div class="head"><b title="${esc(it.title)}">${esc(it.title)}</b>${badge(it.signal)}</div>
        <div class="why">${esc(it.reasons[0] || "")}</div>
        <div class="kpis">
          <div><div class="val">${fmt(it.monthly_sales)}</div><div class="lbl">Sales/mo</div></div>
          <div><div class="val">${pct(it.commission_rate)}</div><div class="lbl">Comm %</div></div>
          <div><div class="val text-primary">${fmt(it.suggest_score)}</div><div class="lbl">Score</div></div>
        </div>
      </div>
    </div>`).join("") || `<div class="empty sm:col-span-2">${ic("sparkles")}<h4>Nothing to suggest yet</h4><p>Suggestions need at least two days of snapshots so velocity and breakout can be scored.</p></div>`;
  const more = all.length - PICKS_DEFAULT;
  $("picks").innerHTML = cards;
  $("picksMore").hidden = more <= 0;
  $("picksMore").innerHTML = state.picksAll ? `Show fewer${ic("chevronUp","h-4 w-4")}` : `Show ${more} more${ic("chevronDown","h-4 w-4")}`;
  $("picksMore").setAttribute("aria-expanded", String(state.picksAll));
  bindHomeItems($("picks"));
}

function renderTopList() {
  const h = state.home, tab = TABS.find(t => t[0] === state.tab) || TABS[0];
  const [key, label, desc, sortKey, valueFn] = tab;
  const items = (h[key] || []).slice(0, LIST_ROWS);
  document.querySelectorAll("#homeTabs .tab").forEach(b => { const on = b.dataset.tab === key; b.setAttribute("aria-selected", String(on)); b.tabIndex = on ? 0 : -1; });
  $("topDesc").textContent = key === "movers" && !items.length ? "Needs more than one day of history" : desc;
  $("topList").innerHTML = items.map((it, i) => `<li data-id="${it.item_id}" tabindex="0" role="button">
      <span class="n">${i+1}</span>${thumb(it, "h-10 w-10")}
      <span class="t" title="${esc(it.title)}">${esc(it.title)}</span>${badge(it.signal)}
      <span class="v">${valueFn(it)}</span></li>`).join("") || `<li class="cursor-default justify-center py-10 text-xs text-muted-foreground hover:bg-transparent">No data for this day</li>`;
  $("viewAll").dataset.sort = sortKey; $("viewAll").setAttribute("aria-label", `View all products sorted by ${label.toLowerCase()}`);
  bindHomeItems($("topList"));
}

function bindHomeItems(root) {
  root.querySelectorAll("[data-id]").forEach(el => {
    el.onclick = e => { if (!e.target.closest("a")) openModal(el.dataset.id); };
    el.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); openModal(el.dataset.id); } };
  });
}

const homeSkeleton = () => `<div class="card xl:col-span-3 p-5"><span class="skel block h-4 w-40"></span><div class="mt-5 grid gap-4 md:grid-cols-2">${Array(6).fill(`<span class="skel block h-24"></span>`).join("")}</div></div>
  <div class="card xl:col-span-2 p-5"><span class="skel block h-4 w-32"></span><span class="skel mt-4 block h-9"></span>${Array(8).fill(`<span class="skel mt-3 block h-8"></span>`).join("")}</div>`;

async function loadHome() {
  const d = $("date").value;
  if (!$("home").children.length) $("home").innerHTML = homeSkeleton();
  const r = await fetch("/api/home" + (d ? "?date="+d : ""));
  if (!r.ok) {
    state.home = null; state.suggested = new Map();
    $("home").innerHTML = `<div class="card xl:col-span-5"><div class="empty">${ic("db")}<h4>No snapshots yet</h4><p>Pull (mock) to try the dashboard with a synthetic day of data. Suggestions and top lists appear here once a snapshot exists.</p><button type="button" class="btn btn-outline btn-sm mt-2" onclick="pull(true)">Pull (mock)</button></div></div>`;
    return;
  }
  const h = await r.json();
  state.home = h; state.picksAll = false;
  state.suggested = new Map(h.suggestions.map(s => [String(s.item_id), s]));
  $("home").innerHTML = `
    <div class="card flex flex-col xl:col-span-3">
      <div class="card-head"><div><h3 class="card-title flex items-center gap-2">${ic("sparkles","h-4 w-4 text-primary")}Suggested for you</h3>
        <p class="card-desc">Best angel + breakout scores today. Open a card to see why.</p></div></div>
      <div id="picks" class="grid gap-4 p-5 pt-2 md:grid-cols-2"></div>
      <div class="flex justify-center px-5 pb-4"><button id="picksMore" type="button" class="btn btn-ghost btn-sm text-muted-foreground" aria-controls="picks"></button></div>
    </div>
    <div class="card flex flex-col xl:col-span-2">
      <div class="card-head items-center pb-4"><div><h3 class="card-title flex items-center gap-2">${ic("trophy","h-4 w-4 text-muted-foreground")}Top today</h3>
        <p class="card-desc" id="topDesc"></p></div>
        <button id="viewAll" type="button" class="btn btn-ghost btn-sm -mr-2 text-primary">View all${ic("chevronRight","h-3.5 w-3.5")}</button></div>
      <div class="px-5"><div id="homeTabs" class="tabs" role="tablist" aria-label="Top lists">${TABS.map(([k,l]) => `<button type="button" role="tab" class="tab" data-tab="${k}" aria-selected="false">${l}</button>`).join("")}</div></div>
      <ol id="topList" class="list flex flex-col gap-0.5 p-3 pt-2"></ol>
    </div>`;
  $("picksMore").onclick = () => { state.picksAll = !state.picksAll; renderPicks(); };
  document.querySelectorAll("#homeTabs .tab").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; store.set("homeTab", state.tab); renderTopList(); });
  $("homeTabs").onkeydown = e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = TABS.findIndex(t => t[0] === state.tab), n = (i + (e.key === "ArrowRight" ? 1 : -1) + TABS.length) % TABS.length;
    state.tab = TABS[n][0]; store.set("homeTab", state.tab); renderTopList(); document.querySelector(`#homeTabs .tab[data-tab="${state.tab}"]`).focus();
  };
  $("viewAll").onclick = () => {
    state.sort = $("viewAll").dataset.sort; state.order = "desc"; state.offset = 0; state.signals.clear();
    if (state.sort === "commission_rate") { $("min_sales").value = 1; setFiltersOpen(true); }
    loadMeta(true).then(load); $("productsTitle").scrollIntoView({behavior:"smooth", block:"start"});
  };
  renderPicks(); renderTopList();
}

// ---------- home toggle (remembered) ----------
function setHomeHidden(hidden, persist=true) {
  $("home").classList.toggle("hidden", hidden);
  $("homeToggle").setAttribute("aria-expanded", String(!hidden));
  $("homeToggleText").textContent = hidden ? "Show home panels" : "Hide home panels";
  if (persist) store.set("homeHidden", hidden ? "1" : "0");
}
$("homeToggle").onclick = () => setHomeHidden(!$("home").classList.contains("hidden"));
if (store.get("homeHidden") === "1") setHomeHidden(true, false);

// ---------- theme ----------
function applyTheme(dark) {
  document.documentElement.classList.toggle("dark", dark);
  $("themeToggle").setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  $("themeToggle").title = dark ? "Switch to light mode" : "Switch to dark mode";
}
applyTheme(document.documentElement.classList.contains("dark"));
$("themeToggle").onclick = () => {
  const dark = !document.documentElement.classList.contains("dark");
  applyTheme(dark); store.set("theme", dark ? "dark" : "light");
};
try {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => { if (!store.get("theme")) applyTheme(e.matches); });
} catch (e) {}

// ---------- actions ----------
async function pull(mock) {
  const b = mock ? $("pullMock") : $("pullLive"); const label = b.querySelector("span");
  const old = label.textContent; b.disabled = true; label.textContent = "Pulling…"; b.querySelector("svg").classList.add("spin");
  try {
    const p = new URLSearchParams(); if (mock) p.set("mock","1"); const d = $("date").value; if (d && mock) p.set("date", d);
    const r = await fetch("/api/ingest?"+p, {method:"POST"}); const j = await r.json();
    r.ok ? toast(`Ingested ${fmt(j.rows)} rows for ${j.snapshot_date} (${j.source})`) : toast(`Ingest failed: ${j.detail}`, "err");
    await loadMeta(false); await load(); await loadHome();
  } catch (e) { toast(`Ingest failed: ${e.message || e}`, "err"); }
  finally { b.disabled = false; label.textContent = old; b.querySelector("svg").classList.remove("spin"); }
}

$("apply").onclick = () => { state.offset = 0; load(); };
$("reset").onclick = () => { for (const k of FILTER_IDS) $(k).value=""; state.signals.clear(); state.offset=0; loadMeta(true).then(load); };
$("date").onchange = () => { state.offset = 0; loadMeta(true).then(load); loadHome(); };
$("prev").onclick = () => { state.offset = Math.max(0, state.offset - state.limit); load(); };
$("next").onclick = () => { state.offset += state.limit; load(); };
$("csv").onclick = () => { setExportOpen(false); window.open("/api/export.csv?" + params()); };
$("json").onclick = () => { setExportOpen(false); window.open("/api/export.json?" + params()); };
$("pullMock").onclick = () => pull(true);
$("pullLive").onclick = () => pull(false);
$("purgeMock").onclick = async () => {
  if (!await confirmDialog()) return;
  const r = await fetch("/api/purge-mock", {method:"POST"}); const j = await r.json();
  r.ok ? toast(`Deleted ${fmt(j.deleted)} mock rows`) : toast(`Failed: ${j.detail}`, "err");
  await loadMeta(false); await load(); await loadHome();
};
document.querySelectorAll(".filters input").forEach(i => i.addEventListener("keydown", e => { if (e.key==="Enter") { e.preventDefault(); state.offset=0; load(); } }));
loadMeta().then(load).then(loadHome);
</script>
