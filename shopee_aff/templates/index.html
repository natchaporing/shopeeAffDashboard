<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopee Affiliate Finder</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1f2933; --muted:#6b7280; --accent:#ee4d2d; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; color:var(--accent); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 16px; }
  .filters label { display:flex; flex-direction:column; font-size:11px; color:var(--muted); gap:2px; }
  .filters input, .filters select { padding:5px 7px; border:1px solid var(--line); border-radius:6px; background:#fff; font-size:13px; min-width:90px; }
  .filters input[type=number] { width:100px; }
  button { padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; font-size:13px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 8px; }
  .chip { padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:12px; user-select:none; }
  .chip.on { border-color:var(--accent); background:#fff1ed; color:var(--accent); font-weight:600; }
  .chip small { color:var(--muted); margin-left:4px; }
  main { padding:0 16px 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; white-space:nowrap; }
  th, td { padding:7px 9px; border-bottom:1px solid var(--line); text-align:right; }
  th { position:sticky; top:0; background:#fafbfc; color:var(--muted); font-weight:600; cursor:pointer; font-size:12px; }
  th.s { color:var(--accent); }
  td.l, th.l { text-align:left; }
  td.title { max-width:340px; overflow:hidden; text-overflow:ellipsis; }
  tr:hover td { background:#fffaf8; }
  tr.detail td { background:#fcfcfd; text-align:left; white-space:normal; }
  .sig { padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; color:#fff; display:inline-block; }
  .sig.Rocket{background:#d62828} .sig.Hidden{background:#7b2cbf} .sig.Rising{background:#2a9d8f} .sig.Fading{background:#8d99ae}
  .sig.Proven{background:#e9a800} .sig.Steady{background:#adb5bd} .sig.Single{background:#ced4da;color:#495057}
  .bar { display:inline-block; height:8px; border-radius:4px; background:linear-gradient(90deg,#ffd6cc,var(--accent)); vertical-align:middle; margin-right:5px; }
  .foot { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; color:var(--muted); font-size:12px; }
  .pos { color:#1b8a5a; } .neg { color:#c0392b; }
  .muted { color:var(--muted); }
  #status { font-size:12px; color:var(--muted); margin-left:auto; }
  .hist { display:grid; grid-template-columns: 320px 1fr; gap:16px; align-items:start; }
  .hist table { font-size:12px; }
  a { color:inherit; }
</style>
</head>
<body>
<header>
  <h1>Shopee Affiliate Finder</h1>
  <label>date <select id="date"></select></label>
  <span id="status">loading…</span>
  <button id="pullMock" title="Ingest synthetic data for the selected date">Pull (mock)</button>
  <button id="pullLive" title="Ingest live data from the Shopee Open API">Pull (live)</button>
</header>

<div class="chips" id="chips"></div>

<div class="filters">
  <label>category <select id="category"><option value="">all</option></select></label>
  <label>min price <input type="number" id="min_price" step="1" placeholder="0"></label>
  <label>max price <input type="number" id="max_price" step="1" placeholder="∞"></label>
  <label>min commission % <input type="number" id="min_commission" step="0.5" placeholder="0"></label>
  <label>min monthly sales <input type="number" id="min_sales" step="10" placeholder="0"></label>
  <label>min rating <input type="number" id="min_rating" step="0.1" placeholder="0"></label>
  <label>search <input type="text" id="q" placeholder="title or shop"></label>
  <label>&nbsp;<button class="primary" id="apply">Apply</button></label>
  <label>&nbsp;<button id="reset">Reset</button></label>
  <label>&nbsp;<button id="csv">Export CSV</button></label>
  <label>&nbsp;<button id="json">Export JSON</button></label>
</div>

<main>
  <div class="card">
    <table id="tbl">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="foot">
    <span id="count"></span>
    <span>
      <button id="prev">‹ prev</button>
      <span id="page"></span>
      <button id="next">next ›</button>
    </span>
  </div>
</main>

<script>
const SIGNALS = {{ signals|tojson }};
const COLS = [
  ["rank","#",false], ["title","product",true], ["category","cat",true], ["price","price",false],
  ["commission_rate","comm %",false], ["monthly_sales","mo. sales",false], ["est_monthly_revenue","est. rev",false],
  ["rating","rating",false], ["partner_count","creators",false], ["gap_score","gap",false],
  ["angel_score","angel",false], ["rank_velocity","velocity",false], ["rank_acceleration","accel",false],
  ["breakout_score","breakout",false], ["signal","signal",false],
];
const state = { sort:"breakout_score", order:"desc", limit:100, offset:0, signals:new Set(), meta:null };
const $ = id => document.getElementById(id);
const fmt = (v, d=0) => v==null ? "<span class=muted>–</span>" : Number(v).toLocaleString(undefined,{maximumFractionDigits:d});
const pct = v => v==null ? "–" : (v*100).toFixed(1)+"%";
const signed = v => v==null ? "<span class=muted>–</span>" : `<span class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${Number(v).toFixed(0)}</span>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function params(extra={}) {
  const p = new URLSearchParams();
  const d = $("date").value; if (d) p.set("date", d);
  for (const k of ["category","min_price","max_price","min_commission","min_sales","min_rating","q"]) {
    const v = $(k).value; if (v !== "") p.set(k, v);
  }
  if (state.signals.size) p.set("signal", [...state.signals].join(","));
  p.set("sort", state.sort); p.set("order", state.order);
  for (const [k,v] of Object.entries(extra)) p.set(k, v);
  return p;
}

async function loadMeta(keepDate=false) {
  const d = keepDate ? $("date").value : "";
  const m = await (await fetch("/api/meta" + (d ? "?date="+d : ""))).json();
  state.meta = m;
  $("date").innerHTML = m.dates.map(x => `<option ${x===m.date?"selected":""}>${x}</option>`).join("");
  $("category").innerHTML = `<option value="">all (${m.total??0})</option>` +
    m.categories.map(c => `<option value="${esc(c.category)}">${esc(c.category)} (${c.count})</option>`).join("");
  $("chips").innerHTML = SIGNALS.map(s =>
    `<span class="chip sig-${s} ${state.signals.has(s)?"on":""}" data-s="${s}">${s}<small>${m.signals[s]||0}</small></span>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const s = c.dataset.s; state.signals.has(s) ? state.signals.delete(s) : state.signals.add(s);
    c.classList.toggle("on"); state.offset = 0; load();
  });
  const run = m.runs && m.runs[0];
  $("status").textContent = m.latest ? `${m.dates.length} snapshot day(s) · last run ${run?run.status:"?"} ${run?run.snapshot_date:""} (${run?run.rows_written:0} rows${run&&run.source==="mock"?", mock":""})`
                                     : "no data yet – click Pull (mock) to try it";
}

function renderHead() {
  $("head").innerHTML = COLS.map(([k,label,left]) =>
    `<th class="${left?'l ':''}${state.sort===k?'s':''}" data-k="${k}">${label}${state.sort===k?(state.order==="desc"?" ▼":" ▲"):""}</th>`).join("");
  document.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (state.sort === k) state.order = state.order === "desc" ? "asc" : "desc";
    else { state.sort = k; state.order = ["title","category","rank","signal"].includes(k) ? "asc" : "desc"; }
    state.offset = 0; load();
  });
}

async function load() {
  renderHead();
  const r = await fetch("/api/products?" + params({limit:state.limit, offset:state.offset}));
  if (!r.ok) { $("body").innerHTML = `<tr><td colspan="${COLS.length}" class="l">${esc((await r.json()).detail)}</td></tr>`; $("count").textContent=""; return; }
  const data = await r.json();
  $("body").innerHTML = data.items.map(it => `
    <tr data-id="${it.item_id}">
      <td>${fmt(it.rank)}</td>
      <td class="l title" title="${esc(it.title)}">${it.product_link?`<a href="${esc(it.product_link)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title)}<br><small class="muted">${esc(it.shop_name||"")}</small></td>
      <td class="l">${esc(it.category||"")}</td>
      <td>${fmt(it.price,2)}</td>
      <td>${pct(it.commission_rate)}</td>
      <td>${fmt(it.monthly_sales)}</td>
      <td>${fmt(it.est_monthly_revenue)}</td>
      <td>${it.rating==null?"–":Number(it.rating).toFixed(1)}</td>
      <td>${fmt(it.partner_count)}</td>
      <td>${fmt(it.gap_score)}</td>
      <td><span class="bar" style="width:${(it.angel_score||0)*0.5}px"></span>${fmt(it.angel_score)}</td>
      <td>${signed(it.rank_velocity)}</td>
      <td>${signed(it.rank_acceleration)}</td>
      <td><span class="bar" style="width:${(it.breakout_score||0)*0.5}px"></span>${fmt(it.breakout_score)}</td>
      <td><span class="sig ${it.signal}">${it.signal}</span></td>
    </tr>`).join("") || `<tr><td colspan="${COLS.length}" class="l muted">no rows match</td></tr>`;
  document.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = e => { if (e.target.tagName!=="A") toggleDetail(tr); });
  const from = data.total ? data.offset+1 : 0, to = Math.min(data.offset+data.limit, data.total);
  $("count").textContent = `${from}–${to} of ${data.total.toLocaleString()} · ${data.date}`;
  $("page").textContent = `page ${Math.floor(data.offset/data.limit)+1} / ${Math.max(1,Math.ceil(data.total/data.limit))}`;
  $("prev").disabled = data.offset === 0; $("next").disabled = to >= data.total;
}

function sparkline(hist) {
  const pts = hist.filter(h => h.rank != null);
  if (pts.length < 2) return "<small class=muted>not enough history for a chart</small>";
  const W=300,H=70,P=6, ranks = pts.map(h=>h.rank), lo=Math.min(...ranks), hi=Math.max(...ranks);
  const x = i => P + i*(W-2*P)/(pts.length-1), y = r => hi===lo ? H/2 : P + (r-lo)*(H-2*P)/(hi-lo);
  const d = pts.map((h,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(h.rank).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" style="background:#fff;border:1px solid var(--line);border-radius:6px">
    <path d="${d}" fill="none" stroke="#ee4d2d" stroke-width="2"/>
    ${pts.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.rank)}" r="2.5" fill="#ee4d2d"><title>${h.snapshot_date}: rank ${h.rank}</title></circle>`).join("")}
    <text x="${P}" y="${H-2}" font-size="9" fill="#6b7280">rank ${hi} (worst)</text>
    <text x="${P}" y="10" font-size="9" fill="#6b7280">rank ${lo} (best) – lower is better</text>
  </svg>`;
}

async function toggleDetail(tr) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("detail")) { next.remove(); return; }
  const d = await (await fetch("/api/products/"+tr.dataset.id)).json();
  const row = document.createElement("tr"); row.className = "detail";
  row.innerHTML = `<td colspan="${COLS.length}"><div class="hist">
    <div>${sparkline(d.history)}<div style="margin-top:6px;font-size:12px">
      item ${d.item.item_id} · shop ${esc(d.item.shop_name||d.item.shop_id||"")} · headroom ${fmt(d.item.headroom)} · gap pct ${fmt(d.item.gap_percentile)}
      ${d.item.offer_link?` · <a href="${esc(d.item.offer_link)}" target="_blank" rel="noopener">affiliate link</a>`:""}</div></div>
    <table><thead><tr><th class=l>date</th><th>rank</th><th>price</th><th>comm %</th><th>mo. sales</th><th>rating</th><th>velocity</th><th>accel</th><th>angel</th><th>breakout</th><th>signal</th></tr></thead>
    <tbody>${d.history.slice().reverse().map(h=>`<tr><td class=l>${h.snapshot_date}</td><td>${fmt(h.rank)}</td><td>${fmt(h.price,2)}</td><td>${pct(h.commission_rate)}</td><td>${fmt(h.monthly_sales)}</td><td>${h.rating==null?"–":Number(h.rating).toFixed(1)}</td><td>${signed(h.rank_velocity)}</td><td>${signed(h.rank_acceleration)}</td><td>${fmt(h.angel_score)}</td><td>${fmt(h.breakout_score)}</td><td><span class="sig ${h.signal}">${h.signal}</span></td></tr>`).join("")}</tbody></table>
  </div></td>`;
  tr.after(row);
}

async function pull(mock) {
  const b = mock ? $("pullMock") : $("pullLive"); b.disabled = true; b.textContent = "pulling…";
  try {
    const p = new URLSearchParams(); if (mock) p.set("mock","1"); const d = $("date").value; if (d && mock) p.set("date", d);
    const r = await fetch("/api/ingest?"+p, {method:"POST"}); const j = await r.json();
    alert(r.ok ? `ingested ${j.rows} rows for ${j.snapshot_date} (${j.source})` : `failed: ${j.detail}`);
    await loadMeta(false); await load();
  } finally { b.disabled = false; b.textContent = mock ? "Pull (mock)" : "Pull (live)"; }
}

$("apply").onclick = () => { state.offset = 0; load(); };
$("reset").onclick = () => { for (const k of ["category","min_price","max_price","min_commission","min_sales","min_rating","q"]) $(k).value=""; state.signals.clear(); state.offset=0; loadMeta(true).then(load); };
$("date").onchange = () => { state.offset = 0; loadMeta(true).then(load); };
$("prev").onclick = () => { state.offset = Math.max(0, state.offset - state.limit); load(); };
$("next").onclick = () => { state.offset += state.limit; load(); };
$("csv").onclick = () => window.open("/api/export.csv?" + params());
$("json").onclick = () => window.open("/api/export.json?" + params());
$("pullMock").onclick = () => pull(true);
$("pullLive").onclick = () => pull(false);
document.querySelectorAll(".filters input").forEach(i => i.addEventListener("keydown", e => { if (e.key==="Enter") { state.offset=0; load(); } }));
loadMeta().then(load);
</script>
</body>
</html>
