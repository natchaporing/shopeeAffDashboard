[project]
name = "shopee-aff-finder"
version = "0.1.0"
description = "Personal Shopee affiliate product-research tool: daily snapshots, signal metrics, filterable dashboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["shopee_aff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
